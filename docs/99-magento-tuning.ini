; Magento 2.4 PHP tuning — Modracx
;
; A separate conf.d file rather than edits to mods-available/*.ini, because those are
; package-managed and a PHP update will overwrite them. This loads last (99-) so it wins,
; and removing this one file reverts everything.

; --- OPcache -----------------------------------------------------------------
; Was 128M, of which 127.2M was in use with 0.8M free and 7 restarts already logged.
; A full OPcache restarts and drops every compiled script, so the next requests recompile
; Magento from source — the single largest avoidable cost on this box.
opcache.memory_consumption=512

; 5,261 scripts were cached against a 10,000 limit. That limit is not currently binding,
; but a fully exercised Magento plus generated/ runs well past it.
opcache.max_accelerated_files=60000

; Magento interns a very large number of strings; the 8M default is routinely exhausted.
opcache.interned_strings_buffer=32

; Left ON deliberately. This is a development box: switching it off would stop PHP from
; noticing edited files, which is the "I changed the code and nothing happened" trap.
opcache.validate_timestamps=1
opcache.revalidate_freq=0

; --- realpath cache ----------------------------------------------------------
; Was at the 4M/120s defaults. Magento stats tens of thousands of paths per request.
realpath_cache_size=10M
realpath_cache_ttl=86400

; --- Xdebug ------------------------------------------------------------------
; Was start_with_request=yes with mode=debug, so every single web request tried to open a
; connection to 127.0.0.1:9003 and waited for it to fail. That is a 2-5x penalty on every
; page, and it is why the profiler was reporting ~12s cold and ~1.3s warm.
;
; "trigger" keeps step debugging fully available — it just waits to be asked, via the
; XDEBUG_TRIGGER cookie/GET parameter or your IDE's browser extension, instead of trying
; on every request including images and AJAX.
xdebug.start_with_request=trigger
