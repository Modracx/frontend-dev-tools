; Magento 2.4 PHP tuning — Modracx — CLI SAPI
;
; Deliberately NOT a copy of the FPM file. The two SAPIs honour different things, and
; pasting the web settings here would look like a fix while doing nothing:
;
;   opcache.memory_consumption, max_accelerated_files, interned_strings_buffer
;       — inert in CLI unless opcache.enable_cli is on, which it is not by default.
;
; Install to /etc/php/8.4/cli/conf.d/99-magento-tuning-cli.ini

; --- Xdebug ------------------------------------------------------------------
; The measured win here, and probably a large one.
;
; CLI had start_with_request=1 with mode=debug, so *every* bin/magento invocation opened
; a connection to 127.0.0.1:9003 and waited for it to fail before doing any work — the
; "Could not connect to debugging client" line on every command. That cost is paid by
; setup:di:compile, setup:upgrade, cache:flush and every cron run.
;
; "trigger" keeps CLI step debugging fully available; it just waits to be asked, via
; XDEBUG_TRIGGER=1 in the environment or `php -d xdebug.start_with_request=yes`.
xdebug.start_with_request=trigger

; --- realpath cache ----------------------------------------------------------
; Was at the 4M/120s defaults here as well. Every CLI process re-stats Magento's file
; tree from cold, so this matters as much on the command line as it does on the web.
realpath_cache_size=10M
realpath_cache_ttl=86400

; --- OPcache for CLI (optional) ----------------------------------------------
; Off by default, and left off here on purpose.
;
; CLI OPcache is per-process: each bin/magento run compiles, caches, then throws it all
; away on exit. Switching on opcache.enable_cli *alone* therefore adds compilation and
; cache-management overhead with nothing to reuse it — it usually makes commands slower,
; which is why the distro default is 0.
;
; It only becomes a win together with file_cache, which persists compiled bytecode to
; disk so the *next* process can reuse it. That is a real speed-up for repeated
; setup:di:compile / setup:upgrade / cron runs.
;
; Uncomment all three together, or none. validate_timestamps still applies, so edited
; files are still noticed. The directory is inside the project so it is owned by the
; same user and is disposable — deleting it only costs one slow run.
;
;   mkdir -p /var/www/html/productdesigner.demo/var/opcache-cli
;
; opcache.enable_cli=1
; opcache.file_cache=/var/www/html/productdesigner.demo/var/opcache-cli
; opcache.file_cache_only=1
